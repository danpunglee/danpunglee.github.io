<script>
/* ==========================================================

const REPO = "https://github.com/danpunglee/danpunglee.github.io";
const ICON = {
  note:'<svg viewBox="0 0 14 16"><path fill-rule="evenodd" d="M6.3 5.69a.942.942 0 0 1-.28-.7c0-.28.09-.52.28-.7.19-.18.42-.28.7-.28.28 0 .52.09.7.28.18.19.28.42.28.7 0 .28-.09.52-.28.7a1 1 0 0 1-.7.3c-.28 0-.52-.11-.7-.3zM8 7.99c-.02-.25-.11-.48-.31-.69-.2-.19-.42-.3-.69-.31H6c-.27.02-.48.13-.69.31-.2.2-.3.44-.31.69h1v3c.02.27.11.5.31.69.2.2.42.31.69.31h1c.27 0 .48-.11.69-.31.2-.19.3-.42.31-.69H8V7.98v.01zM7 2.3c-3.14 0-5.7 2.54-5.7 5.68 0 3.14 2.56 5.7 5.7 5.7s5.7-2.55 5.7-5.7c0-3.15-2.56-5.69-5.7-5.69v.01zM7 .98c3.86 0 7 3.14 7 7s-3.14 7-7 7-7-3.12-7-7 3.14-7 7-7z"/></svg>',
  tip:'<svg viewBox="0 0 12 16"><path fill-rule="evenodd" d="M6.5 0C3.48 0 1 2.19 1 5c0 .92.55 2.25 1 3 1.34 2.25 1.78 2.78 2 4v1h5v-1c.22-1.22.66-1.75 2-4 .45-.75 1-2.08 1-3 0-2.81-2.48-5-5.5-5zm3.64 7.48c-.25.44-.47.8-.67 1.11-.86 1.41-1.25 2.06-1.45 3.23-.02.05-.02.11-.02.17H5c0-.06 0-.13-.02-.17-.2-1.17-.59-1.83-1.45-3.23-.2-.31-.42-.67-.67-1.11C2.44 6.78 2 5.65 2 5c0-2.2 2.02-4 4.5-4 1.22 0 2.36.42 3.22 1.19C10.55 2.94 11 3.94 11 5c0 .66-.44 1.78-.86 2.48zM4 14h5c-.23 1.14-1.3 2-2.5 2s-2.27-.86-2.5-2z"/></svg>',
  info:'<svg viewBox="0 0 14 16"><path fill-rule="evenodd" d="M7 2.3c3.14 0 5.7 2.56 5.7 5.7s-2.56 5.7-5.7 5.7A5.71 5.71 0 0 1 1.3 8c0-3.14 2.56-5.7 5.7-5.7zM7 1C3.14 1 0 4.14 0 8s3.14 7 7 7 7-3.14 7-7-3.14-7-7-7zm1 3H6v5h2V4zm0 6H6v2h2v-2z"/></svg>',
  warning:'<svg viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8.893 1.5c-.183-.31-.52-.5-.887-.5s-.703.19-.886.5L.138 13.499a.98.98 0 0 0 0 1.001c.193.31.53.501.886.501h13.964c.367 0 .704-.19.877-.5a1.03 1.03 0 0 0 .01-1.002L8.893 1.5zm.133 11.497H6.987v-2.003h2.039v2.003zm0-3.004H6.987V5.987h2.039v4.006z"/></svg>'
};
const ADM_DEFAULT = { note:"참고", tip:"팁", info:"정보", warning:"주의" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Markdown → HTML ---------- */
// :::info 제목 ... ::: 블록을 안내 박스로 바꾸고, 나머지는 marked로 변환
function mdToHtml(md){
  const lines = md.replace(/\r\n?/g, "\n").split("\n");
  let out = "", buf = [], inFence = false, adm = null;
  const flush = () => { if (buf.length){ out += marked.parse(buf.join("\n")); buf = []; } };
  for (const line of lines){
    if (/^\s*(```|~~~)/.test(line)) inFence = !inFence;
    const open = !inFence && !adm && line.match(/^:::\s*(note|tip|info|warning)\s*(.*)$/);
    if (open){ flush(); adm = { type:open[1], title:open[2].trim() || ADM_DEFAULT[open[1]] }; continue; }
    if (!inFence && adm && /^:::\s*$/.test(line)){
      const body = marked.parse(buf.join("\n")); buf = [];
      out += `<div class="admonition admonition--${adm.type}"><div class="admonition__title">${ICON[adm.type]}${esc(adm.title)}</div>${body}</div>`;
      adm = null; continue;
    }
    buf.push(line);
  }
  flush();
  return out;
}
const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s+/g, "-") || "section";

/* ---------- Data ---------- */
let SIDEBAR = [], ORDER = [], TITLES = {};
const MD = {}; // id -> markdown text
const groupOf = id => SIDEBAR.find(g => g.items.some(i => i.id === id));
async function loadSidebar(){
  const r = await fetch("docs/sidebar.json", { cache:"no-cache" });
  SIDEBAR = await r.json();
  ORDER = SIDEBAR.flatMap(g => g.items.map(i => i.id));
  SIDEBAR.forEach(g => g.items.forEach(i => TITLES[i.id] = i.title));
}
async function loadDoc(id){
  if (MD[id] !== undefined) return MD[id];
  const r = await fetch(`docs/${encodeURIComponent(id)}.md`, { cache:"no-cache" });
  MD[id] = r.ok ? await r.text() : null;
  return MD[id];
}
const LOGO = document.querySelector(".navbar__brand svg").outerHTML;

/* ---------- Theme ---------- */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const root = document.documentElement, themeBtn = document.getElementById("themeToggle"), themeIcon = document.getElementById("themeIcon");
function setTheme(t, save){ root.dataset.theme = t; themeIcon.innerHTML = t === "dark" ? MOON : SUN; if (save) { try { localStorage.setItem("theme", t); } catch(e){} } }
let saved = null; try { saved = localStorage.getItem("theme"); } catch(e){}
setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
themeBtn.onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark", true);

/* ---------- Render ---------- */
const app = document.getElementById("app");
const FEATURE_ICON = [
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>'
];

function renderHome(){
  // 메인 페이지: 대문 사진 + 인사말 + 하단 사진 2장
  app.innerHTML = `
<main class="photo">
  <h1 class="photo__hello">안녕하세요. 단풍이에요.</h1>
  <img class="photo__hero" src="dog.jpg" alt="단풍이 대문 사진">
  <div class="photo__row">
    <img src="dog-left.jpg" alt="웃고 있는 단풍이" loading="lazy">
    <img src="dog-right.jpg" alt="고개를 갸웃한 단풍이" loading="lazy">
  </div>
</main>`;
  setActiveNav(null);
  document.title = "단풍이 | danpunglee";
}

let collapsedCats = new Set();
function sidebarHTML(cur){
  return `<div class="sidebar__head"><a class="navbar__brand" href="#/">${LOGO}danpunglee</a><button class="sq-btn" id="sbClose" aria-label="메뉴 닫기"><svg viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="sidebar__menu"><ul class="menu__list">${SIDEBAR.map(g => `
  <li class="menu__item${collapsedCats.has(g.label) ? " collapsed" : ""}"><button class="menu__cat" data-cat="${esc(g.label)}">${esc(g.label)}</button>
    <ul class="menu__list">${g.items.map(i => `<li class="menu__item"><a class="menu__link${i.id===cur?" active":""}" href="#/docs/${i.id}">${esc(i.title)}</a></li>`).join("")}</ul>
  </li>`).join("")}
</ul></div>
<button class="sidebar__collapse" id="sbCollapse" aria-label="사이드바 접기" title="사이드바 접기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg></button>`;
}

function tocHTML(heads){
  if (!heads.length) return "";
  let html = "<ul>", inSub = false;
  heads.forEach(h => {
    if (h.level === 3 && !inSub){ html = html.replace(/<\/li>$/, "") + "<ul>"; inSub = true; }
    else if (h.level === 2 && inSub){ html += "</ul></li>"; inSub = false; }
    html += `<li><a href="#" data-target="${h.id}">${esc(h.text)}</a></li>`;
  });
  if (inSub) html += "</ul></li>";
  return html + "</ul>";
}

let sbHidden = false, renderSeq = 0;
async function renderDoc(id){
  const seq = ++renderSeq;
  if (!ORDER.includes(id)) { const md = await loadDoc(id); if (md == null) return renderNotFound(); }
  const g = groupOf(id), i = ORDER.indexOf(id), prev = ORDER[i-1], next = ORDER[i+1];
  app.innerHTML = `
<div class="docs${sbHidden ? " sb-hidden" : ""}" id="docs">
  <aside class="sidebar" id="sidebar"><div class="sidebar__inner">${sidebarHTML(id)}</div></aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main"><div class="doc">
    <div class="doc__col">
      <nav aria-label="Breadcrumbs"><ul class="breadcrumbs">
        ${g ? `<li><a href="#/docs/${g.items[0].id}">${esc(g.label)}</a></li>` : ""}
        <li><span>${esc(TITLES[id] || id)}</span></li>
      </ul></nav>
      <details class="toc-mobile"><summary>이 페이지의 내용</summary><div class="toc" id="tocMobile"></div></details>
      <article class="markdown" id="article"><p class="md-loading">불러오는 중…</p></article>
      <div class="doc-footer">
        <a href="${REPO}/edit/main/docs/${id}.md" target="_blank" rel="noopener"><svg viewBox="0 0 40 40"><path d="m34.5 11.7-3 3.1-6.3-6.3 3.1-3q.5-.5 1.2-.5t1.1.5l3.9 3.9q.5.4.5 1.1t-.5 1.2zm-29.5 17.1 18.4-18.5 6.3 6.3-18.4 18.4h-6.3v-6.2z"/></svg>이 페이지 수정하기</a>
      </div>
      <nav class="pagination-nav" aria-label="문서 페이지">
        ${prev ? `<a class="pagination-nav__link pagination-nav__link--prev" href="#/docs/${prev}"><span class="pagination-nav__sub">이전</span><span class="pagination-nav__label">${esc(TITLES[prev])}</span></a>` : ""}
        ${next ? `<a class="pagination-nav__link pagination-nav__link--next" href="#/docs/${next}"><span class="pagination-nav__sub">다음</span><span class="pagination-nav__label">${esc(TITLES[next])}</span></a>` : ""}
      </nav>
    </div>
    <div class="toc-col"><div class="toc" id="toc"></div></div>
  </div></main>
</div>`;
  document.querySelectorAll(".menu__cat").forEach(b => b.onclick = () => {
    const li = b.parentElement; li.classList.toggle("collapsed");
    li.classList.contains("collapsed") ? collapsedCats.add(b.dataset.cat) : collapsedCats.delete(b.dataset.cat);
  });
  document.getElementById("sbCollapse").onclick = () => { sbHidden = !sbHidden; document.getElementById("docs").classList.toggle("sb-hidden", sbHidden); };
  document.getElementById("sbClose").onclick = closeSidebar;
  document.getElementById("backdrop").onclick = closeSidebar;
  setActiveNav(id);
  document.title = `${TITLES[id] || id} | danpunglee`;

  const md = await loadDoc(id);
  if (seq !== renderSeq) return;
  const article = document.getElementById("article");
  if (md == null){ article.innerHTML = `<h1>페이지를 찾을 수 없습니다</h1><p><code>docs/${esc(id)}.md</code> 파일이 없습니다.</p>`; return; }
  article.innerHTML = mdToHtml(md);

  // 외부 링크는 새 탭으로
  article.querySelectorAll('a[href^="http"]').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  // 제목 다음 첫 문단은 리드 문장
  const h1 = article.querySelector("h1");
  if (h1 && h1.nextElementSibling?.tagName === "P") h1.nextElementSibling.classList.add("lead");
  if (h1 && !TITLES[id]) document.title = `${h1.textContent} | danpunglee`;
  // 제목 줄 + 본문 복사 버튼
  if (h1){
    const head = document.createElement("div"); head.className = "doc__head";
    h1.replaceWith(head); head.appendChild(h1);
    head.insertAdjacentHTML("beforeend", `<div class="copy-btn"><button id="copyPage" title="마크다운 원문 복사"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>본문 복사</span></button><a href="${REPO}/blob/main/docs/${id}.md" target="_blank" rel="noopener" aria-label="원문 보기" title="원문 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></a></div>`);
    document.getElementById("copyPage").onclick = async e => {
      const lab = e.currentTarget.querySelector("span");
      try { await navigator.clipboard.writeText(md); lab.textContent = "복사됨"; }
      catch(err){ lab.textContent = "복사 실패"; }
      setTimeout(() => lab.textContent = "본문 복사", 1500);
    };
  }
  // 제목 id ({#id} 지원) + 앵커 + 목차
  const used = new Set();
  const heads = [...article.querySelectorAll("h2, h3")].filter(h => !h.closest(".card, .admonition")).map(h => {
    let text = h.textContent, id2;
    const m = text.match(/\s*\{#([\w-]+)\}\s*$/);
    if (m){ id2 = m[1]; text = text.slice(0, m.index); h.innerHTML = h.innerHTML.replace(/\s*\{#[\w-]+\}\s*$/, ""); }
    id2 = id2 || slug(text);
    let base = id2, n = 1; while (used.has(id2)) id2 = `${base}-${n++}`; used.add(id2);
    h.id = id2;
    const a = document.createElement("a"); a.className = "heading-anchor"; a.href = "#"; a.textContent = "#"; a.dataset.target = id2; a.setAttribute("aria-label", "링크");
    h.appendChild(a);
    return { id:id2, text:text.trim(), level:+h.tagName[1] };
  });
  const toc = tocHTML(heads);
  document.getElementById("toc").innerHTML = toc;
  document.getElementById("tocMobile").innerHTML = toc;
  if (!heads.length) document.querySelector(".toc-mobile").style.display = "none";
  spy();
}

function renderNotFound(){
  app.innerHTML = `<main style="max-width:780px;margin:0 auto;padding:4rem 1rem 6rem" class="markdown"><h1>페이지를 찾을 수 없습니다</h1><p>요청한 페이지가 없습니다. <a href="#/">홈으로 돌아가기</a></p></main>`;
  setActiveNav(null);
}

function setActiveNav(id){
  const key = ["projects","notes","contact","site"].includes(id) ? id : id ? "docs" : null;
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("active", a.dataset.nav === key));
}

/* ---------- Router ---------- */
function route(){
  closeSidebar();
  const h = location.hash.replace(/^#/, "") || "/";
  const m = h.match(/^\/docs\/([\w-]+)/);
  if (h === "/" ) renderHome();
  else if (m) renderDoc(m[1]);
  else renderNotFound();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);

/* in-page anchors (TOC / heading links) */
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-target]"); if (!a) return;
  e.preventDefault();
  const el = document.getElementById(a.dataset.target);
  if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
  const det = a.closest("details"); if (det) det.open = false;
});

/* scroll-spy */
function spy(){
  const heads = [...document.querySelectorAll("#article h2[id], #article h3[id]")];
  const links = [...document.querySelectorAll("#toc a")];
  if (!heads.length) return;
  let cur = heads[0].id;
  for (const h of heads){ if (h.getBoundingClientRect().top < 180) cur = h.id; }
  links.forEach(l => l.classList.toggle("active", l.dataset.target === cur));
}
addEventListener("scroll", () => requestAnimationFrame(spy), { passive:true });

/* mobile sidebar */
function closeSidebar(){ document.getElementById("sidebar")?.classList.remove("open"); document.getElementById("backdrop")?.classList.remove("open"); }
document.getElementById("menuToggle").onclick = () => {
  if (!document.getElementById("sidebar")) { location.hash = "#/docs/intro"; setTimeout(openSidebar, 300); return; }
  openSidebar();
};
function openSidebar(){ document.getElementById("sidebar")?.classList.add("open"); document.getElementById("backdrop")?.classList.add("open"); }

/* ---------- Search (모든 .md를 불러와 검색) ---------- */
const modal = document.getElementById("searchModal"), input = document.getElementById("searchInput"), results = document.getElementById("searchResults");
let INDEX = [];
async function buildIndex(){
  await Promise.all(ORDER.map(loadDoc));
  INDEX = ORDER.filter(id => MD[id] != null).map(id => {
    const d = document.createElement("div"); d.innerHTML = mdToHtml(MD[id]);
    return { id, title:TITLES[id], group:groupOf(id).label, text:d.textContent.replace(/\{#[\w-]+\}/g, "").replace(/\s+/g, " ") };
  });
  if (modal.classList.contains("open")) doSearch();
}
let sel = 0;
function openSearch(){ modal.classList.add("open"); input.value = ""; doSearch(); setTimeout(() => input.focus(), 0); }
function closeSearch(){ modal.classList.remove("open"); }
function doSearch(){
  const q = input.value.trim().toLowerCase();
  const list = q ? INDEX.filter(x => (x.title + " " + x.text).toLowerCase().includes(q)) : INDEX;
  sel = 0;
  if (!INDEX.length){ results.innerHTML = `<li class="search-empty">문서를 불러오는 중…</li>`; return; }
  if (!list.length){ results.innerHTML = `<li class="search-empty">"${esc(input.value)}"에 대한 결과가 없습니다</li>`; return; }
  results.innerHTML = list.map((x, i) => {
    let snip = x.text.slice(0, 70);
    if (q){ const p = x.text.toLowerCase().indexOf(q); if (p > -1) snip = (p > 20 ? "…" : "") + x.text.slice(Math.max(0, p-20), p+50); }
    return `<li><a href="#/docs/${x.id}" class="${i===0?"sel":""}">${esc(x.group)} › <strong>${esc(x.title)}</strong><small>${esc(snip)}</small></a></li>`;
  }).join("");
}
function move(d){ const as = [...results.querySelectorAll("a")]; if (!as.length) return; as[sel].classList.remove("sel"); sel = (sel + d + as.length) % as.length; as[sel].classList.add("sel"); as[sel].scrollIntoView({ block:"nearest" }); }
input.addEventListener("input", doSearch);
input.addEventListener("keydown", e => {
  if (e.key === "ArrowDown"){ e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); move(-1); }
  else if (e.key === "Enter"){ const a = results.querySelectorAll("a")[sel]; if (a){ location.hash = a.getAttribute("href"); closeSearch(); } }
});
results.addEventListener("click", e => { if (e.target.closest("a")) closeSearch(); });
modal.addEventListener("click", e => { if (e.target === modal) closeSearch(); });
document.getElementById("searchBtn").onclick = openSearch;
addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); modal.classList.contains("open") ? closeSearch() : openSearch(); }
  else if (e.key === "Escape"){ closeSearch(); closeSidebar(); }
});
if (/Mac|iPhone|iPad/.test(navigator.platform)) document.getElementById("modKey").textContent = "⌘";

document.getElementById("year").textContent = new Date().getFullYear();

/* ---------- Start ---------- */
loadSidebar()
  .then(() => { route(); buildIndex(); })
  .catch(err => { app.innerHTML = `<main class="home"><h1>메뉴를 불러오지 못했습니다</h1><p><code>docs/sidebar.json</code> 형식을 확인해 주세요. (${esc(err.message)})</p></main>`; });
</script>
</body>
